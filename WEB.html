<button id="darkModeToggle" class="floating-btn">
    <i class="fas fa-moon"></i>
</button>

<!-- BANNER / HERO SLIDER -->
<header class="banner" id="home">
    <div class="banner-slide active" style="background-image:url('img/banner\ 1.jpg')">
        <div class="banner-content">
            <h1>Resep Nusantara</h1>
            <p>Cita rasa asli Indonesia</p>
        </div>
    </div>
    <div class="banner-slide" style="background-image:url('img/banner\ 2.jpg')">
        <div class="banner-content">
            <h1>Masak Jadi Mudah</h1>
            <p>Resep tradisional & modern</p>
        </div>
    </div>
</header>

<!-- FILTER -->
<section class="filter">
    <input type="text" id="searchBar" placeholder="Cari resep favorit...">
    <select id="categoryFilter">
        <option value="semua">Semua</option>
        <option value="makanan-berat">Makanan Berat</option>
        <option value="kue">Kue & Jajanan</option>
        <option value="minuman">Minuman</option>
    </select>
</section>

<!-- KATALOG -->
<main class="catalog" id="katalog"></main>

<!-- MODAL -->
<div class="modal" id="recipeModal">
    <div class="modal-box">
        <span id="closeModal">&times;</span>
        <img id="modalImage">
        <h2 id="modalTitle"></h2>
        <h4>Bahan</h4>
        <ul id="modalIngredients"></ul>
        <h4>Cara Memasak</h4>
        <p id="modalInstructions"></p>
    </div>
</div>
